<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Policies — Steven Ludmon</title>
<style>
  :root {
    color-scheme: light dark;
    --ink: #1c1b1f;
    --muted: #49454f;
    --bg: #fffbfe;
    --accent: #4f378b;
    --rule: #e7e0ec;
    --card: #f3edf7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e6e1e5;
      --muted: #cac4d0;
      --bg: #1c1b1f;
      --accent: #d0bcff;
      --rule: #49454f;
      --card: #2b2930;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }
  h1 {
    font-size: 1.75rem;
    margin-bottom: 8px;
    color: var(--accent);
  }
  p.intro {
    color: var(--muted);
    margin-bottom: 32px;
  }
  ul.apps {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  ul.apps li {
    background: var(--card);
    border-radius: 12px;
    padding: 16px 20px;
  }
  ul.apps a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    font-size: 1.05rem;
  }
  ul.apps a:hover {
    text-decoration: underline;
  }
  hr {
    border: none;
    border-top: 1px solid var(--rule);
    margin: 40px 0 24px;
  }
  footer {
    color: var(--muted);
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<main>
  <h1>App Policies</h1>
  <p class="intro">Privacy policies for Steven Ludmon's mobile apps.</p>

  <ul class="apps">
    <li><a href="timekeeper/">TimeKeeper — Privacy Policy</a></li>
    <li><a href="scorekeeper/">ScoreKeeper — Privacy Policy</a></li>
    <li><a href="scorekeeper-premium/">ScoreKeeper Premium — Privacy Policy</a></li>
  </ul>

  <hr>
  <footer>&copy; Steven Ludmon</footer>
</main>
</body>
</html>
